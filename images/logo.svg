    <circle cx="100" cy="195" r="9"/>
    <circle cx="400" cy="195" r="9"/>
    <circle cx="112" cy="225" r="10"/>
    <circle cx="388" cy="225" r="10"/>
    <circle cx="128" cy="145" r="10"/>
    <circle cx="372" cy="145" r="10"/>
