  <defs>
    <radialGradient id="badgeGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#124a3d"/>
      <stop offset="65%" stop-color="#0B362C"/>
      <stop offset="100%" stop-color="#051c16"/>
    </radialGradient>
    <radialGradient id="rimGrad" cx="50%" cy="50%" r="50%">
      <stop offset="88%" stop-color="transparent"/>
      <stop offset="96%" stop-color="#0B362C" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer background circle -->
  <circle cx="250" cy="250" r="242" fill="url(#badgeGrad)"/>
  
  <!-- Subtle inner boundary ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#164d3f" stroke-width="4" opacity="0.6"/>
  
  <!-- Vignette overlay -->
  <circle cx="250" cy="250" r="242" fill="url(#rimGrad)"/>

