          fill="#E5B84A">TREEHOUSE</text>
    
    <!-- "CAFE" -->
    <text x="250" y="366" text-anchor="middle"
          font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="26"
          font-weight="600"
          letter-spacing="16"
