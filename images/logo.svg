    <path d="M 215 188 Q 192 165 168 160 Q 152 158 140 166" fill="none" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 235 175 Q 212 152 190 144 Q 175 140 162 148" fill="none" stroke-width="3" stroke-linecap="round"/>
    <path d="M 242 150 Q 224 130 202 122 Q 188 118 178 124" fill="none" stroke-width="2.5" stroke-linecap="round"/>
